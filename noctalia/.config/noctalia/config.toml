[audio]
enable_notification_sounds = false

[backdrop]
enabled = false

[bar.default]
background_opacity = 0.99999997764825821
capsule = false
center = [ "taskbar" ]
compositor_blur = false
end = [ "tray", "keyboard_layout", "notifications", "battery", "volume", "control-center", "clock" ]
margin_edge = 0
margin_ends = 0
padding = 12
position = "top"
radius = 0
start = [ "sysmon", "active_window", "media" ]
widget_spacing = 6

[dock]
enabled = false
radius = 0

[location]
address = "Moscow"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 1.0
layer = "overlay"
position = "top_right"

[shell]
avatar_path = "/home/nick/.face"
corner_radius_scale = 0.0
font_family = "Sans Serif"
settings_show_advanced = true
telemetry_enabled = false

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.launcher]
    sort_by_usage = true

    [shell.panel]
    control_center_placement = "attached"
    open_near_click_control_center = true

    [shell.shadow]
    alpha = 0.55000000000000004
    direction = "down_right"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/nick/Pictures/Wallpapers"
enabled = true
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "honeycomb" ]
transition_duration = 1500

    [wallpaper.default]
    path = "/home/nick/Pictures/Wallpapers/tokyo-night.png"

    [wallpaper.last]
    path = "/home/nick/Pictures/Wallpapers/tokyo-night.png"

    [wallpaper.monitors.DP-2]
    path = "/home/nick/Pictures/Wallpapers/tokyo-night.png"

[widget.taskbar]
capsule_radius = 0
group_by_workspace = true

[widget.tray]
drawer = true
